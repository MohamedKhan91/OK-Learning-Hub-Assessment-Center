<style>
:root{
  --navy:#172E55; --navy-ink:#0B1526; --navy-soft:#415474; --navy-mid:#A2ADBE;
  --navy-tint:#E9ECF0; --paper:#F4F5F7; --card:#FFFFFF; --line:#D1D5DD;
  --text-soft:#5C6C88; --accent:#172E55;
  --ink-black:#000000;
  --radius:18px;
  --heading-font:'Fredoka','Arial Rounded MT Bold','Segoe UI',sans-serif;
  --body-font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --shadow:0 10px 30px rgba(11,21,38,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 6% 10%, rgba(23,46,85,.05) 0, transparent 38%),
    radial-gradient(circle at 94% 88%, rgba(23,46,85,.05) 0, transparent 40%);
  font-family:var(--body-font); color:var(--navy-ink);
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--heading-font);color:var(--navy-ink);line-height:1.2;margin:0 0 10px;}
h1{font-size:clamp(26px,4vw,38px);}
h2{font-size:clamp(20px,3vw,26px);}
h3{font-size:17px;}
p{margin:0 0 12px;}
a{color:var(--navy);text-decoration:none;}
button{font-family:inherit;}
::selection{background:var(--navy-tint);}

/* ---------- layout ---------- */
.wrap{max-width:1060px;margin:0 auto;padding:0 clamp(16px,4vw,30px) 90px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,3.4vw,30px);margin-bottom:22px;}
.muted{color:var(--text-soft);}
.small{font-size:13px;}
.center{text-align:center;}
.pill{display:inline-block;background:var(--navy-tint);color:var(--navy);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 14px;margin-bottom:14px;}
.lede{font-size:16.5px;color:var(--text-soft);max-width:640px;}

/* ---------- header (logo palette: black band, white logo) ---------- */
header.topbar{position:sticky;top:0;z-index:60;background:#000000;border-bottom:1px solid rgba(255,255,255,.14);}
.topbar-in{max-width:1060px;margin:0 auto;padding:10px clamp(16px,4vw,30px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand .logo-img{height:46px;width:auto;display:block;}
.brand-name{font-family:var(--heading-font);font-size:15px;color:#FFFFFF;line-height:1.15;letter-spacing:.02em;}
.brand-sub{font-size:11px;color:var(--navy-mid);letter-spacing:.08em;text-transform:uppercase;}
.top-nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;}
.top-nav button{border:0;background:transparent;color:#C6CDD8;font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;}
.top-nav button:hover{background:rgba(255,255,255,.1);color:#fff;}
.top-nav button.on{background:#FFFFFF;color:#000000;}
.xp-box{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 12px;}
.xp-lvl{font-family:var(--heading-font);color:#FFFFFF;font-size:14px;white-space:nowrap;}
.xp-track{width:120px;height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;}
.xp-fill{height:100%;width:0;background:linear-gradient(90deg,#FFFFFF,#A2ADBE);border-radius:99px;transition:width .6s ease;}
.xp-num{font-size:12px;color:#C6CDD8;white-space:nowrap;font-variant-numeric:tabular-nums;}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(135deg,#000000 0%,var(--navy) 62%,#22406F 100%);color:#fff;padding:clamp(30px,6vw,58px);margin:26px 0 30px;box-shadow:0 24px 60px rgba(11,21,38,.28);}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 10%, rgba(255,255,255,.07), transparent 42%);pointer-events:none;}
.hero .hero-logo{position:absolute;right:clamp(14px,4vw,40px);top:clamp(14px,4vw,36px);height:clamp(54px,7vw,92px);width:auto;opacity:.92;z-index:1;pointer-events:none;}
.hero h1{color:#fff;font-size:clamp(28px,5vw,44px);margin-bottom:12px;position:relative;z-index:1;}
.hero .lede{color:#C6CDD8;position:relative;z-index:1;max-width:640px;}
.hero .lede strong{color:#fff;}
.hero .pill{background:rgba(255,255,255,.12);color:#FFFFFF;position:relative;z-index:1;}
.hero .name-row{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.hero input{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;min-width:230px;outline:none;}
.hero input::placeholder{color:var(--navy-mid);}
.hero input:focus{border-color:#fff;}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:6px;}
.station{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;overflow:hidden;}
.station:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(11,21,38,.14);}
.station .glyph{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:#fff;font-family:var(--heading-font);font-size:20px;}
.station h3{margin-bottom:4px;font-size:18px;}
.station p{font-size:13.5px;color:var(--text-soft);margin-bottom:10px;}
.station .st-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--navy-soft);font-weight:600;}
.station .st-prog{position:absolute;left:0;bottom:0;height:5px;background:var(--navy);width:0;transition:width .5s;}
.station.done{outline:2px solid rgba(23,46,85,.4);}
.station.done:after{content:"✓";position:absolute;top:14px;right:16px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 4px 10px rgba(23,46,85,.4);}
.station .locknote{font-size:11px;color:var(--text-soft);}

/* ---------- journey rail ---------- */
.rail-wrap{margin:0 0 18px;}
.journey-track{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;}
.journey-step{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--navy-mid);white-space:nowrap;cursor:pointer;padding:6px 10px;border-radius:99px;border:1px solid transparent;transition:.2s;}
.journey-step .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.journey-step.active{background:var(--navy);color:#fff;}
.journey-step.active .dot{background:#fff;}
.journey-step.done{color:var(--navy);border-color:var(--line);background:var(--card);}
.journey-step.done .dot{background:var(--navy);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 20px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(23,46,85,.25);}
.btn-primary:hover{background:#22406F;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
.btn-gold{background:#000000;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);}
.hero .btn-gold{background:#fff;color:#000;}
.btn-ghost{background:transparent;color:var(--navy-soft);border-color:var(--line);}
.btn-ghost:hover{background:var(--navy-tint);}
.btn-outline{background:var(--card);color:var(--navy);border-color:var(--navy);}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px;}
.nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap;}

/* ---------- quiz ---------- */
.eyebrow-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-soft);margin-bottom:8px;}
.q-progress-bar{height:7px;background:var(--navy-tint);border-radius:99px;overflow:hidden;margin-bottom:20px;}
.q-progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--navy-soft));border-radius:99px;transition:width .3s;}
.question-text{font-size:clamp(19px,2.6vw,23px);margin-bottom:18px;max-width:760px;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;cursor:pointer;color:var(--navy-ink);transition:border-color .15s, background .15s;width:100%;}
.option:hover{border-color:var(--navy-soft);}
.option.selected{border-color:var(--navy);background:var(--navy-tint);}
.option .mark{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--navy-mid);margin-top:2px;}
.option.selected .mark{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 3px #fff;}
.option.correct{border-color:var(--navy);background:#F0F3F8;}
.option.correct .mark{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 3px #fff;}
.option.wrong{border-color:#000;background:#C6CDD8;}
.option.wrong .mark{background:#000;border-color:#000;box-shadow:inset 0 0 0 3px #C6CDD8;}
.likert-scale{display:flex;flex-direction:column;gap:8px;}
.likert-opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;transition:.15s;}
.likert-opt:hover{border-color:var(--navy-soft);}
.likert-opt.selected{border-color:var(--navy);background:var(--navy-tint);}
.likert-opt .num{width:26px;height:26px;border-radius:50%;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.likert-opt.selected .num{background:var(--navy);color:#fff;}
.likert-opt .lbl{font-size:14px;color:var(--text-soft);}

/* ---------- results ---------- */
.result-hero{display:flex;align-items:center;gap:18px;margin-bottom:14px;}
.result-icon{min-width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px;}
.result-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
.result-block h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin-bottom:6px;}
.result-block p{font-size:14.5px;margin:0;}
.bar-row{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;margin:10px 0;}
.bar-row .label{font-size:13px;font-weight:600;color:var(--navy-soft);}
.bar-track{height:10px;background:var(--navy-tint);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .7s ease;}
.bar-pct{font-size:12.5px;color:var(--text-soft);font-variant-numeric:tabular-nums;text-align:right;}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-bottom:4px;}
.summary-section{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;background:var(--card);}
.summary-section h4{margin:2px 0 6px;font-size:18px;}

/* ---------- stage list ---------- */
.stage-list{list-style:none;padding:0;margin:16px 0;display:flex;flex-direction:column;gap:10px;max-width:680px;position:relative;z-index:1;}
.stage-list li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:#C6CDD8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;}
.stage-list .num{flex:0 0 26px;height:26px;border-radius:50%;background:#FFFFFF;color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--heading-font);}
.home .stage-list{color:var(--text-soft);}
.home .stage-list li{background:var(--card);border-color:var(--line);color:var(--text-soft);}
.home .stage-list li strong{color:var(--navy);}
.home .stage-list .num{background:var(--navy);color:#fff;}

/* ---------- badges & toast ---------- */
.badge-shelf{display:flex;flex-wrap:wrap;gap:10px;}
.badge{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 8px;font-size:13px;font-weight:600;color:var(--navy);}
.badge.locked{opacity:.4;filter:grayscale(1);}
.badge .medal{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--heading-font);font-size:13px;border:2px solid #fff;box-shadow:0 2px 8px rgba(23,46,85,.35);}
.badge.locked .medal{background:var(--line);color:var(--text-soft);box-shadow:none;}
#toastZone{position:fixed;right:18px;top:74px;z-index:120;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{background:#000;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.28);display:flex;gap:10px;align-items:center;animation:toastin .4s ease;max-width:320px;}
.toast .t-xp{color:#fff;font-weight:800;white-space:nowrap;border-left:2px solid var(--navy-mid);padding-left:10px;}
@keyframes toastin{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:none;}}
.confetti-piece{position:fixed;top:-12px;width:9px;height:14px;z-index:130;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9;}}
.flash-award{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(23,46,85,.14),transparent 60%);z-index:110;animation:flashfade 1s ease forwards;}
@keyframes flashfade{to{opacity:0;}}

/* ---------- games ---------- */
.game-shell{background:linear-gradient(160deg,#E9ECF0,#F4F5F7);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);}
.game-title{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.game-title .gg{width:40px;height:40px;border-radius:12px;background:var(--navy-ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--heading-font);font-size:18px;}
.game-meta{font-size:12.5px;color:var(--text-soft);margin-bottom:16px;}
.score-strip{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
.score-chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--navy);}
.score-chip b{color:var(--navy-ink);font-size:16px;font-variant-numeric:tabular-nums;}
.trigger-box{background:#000;color:#fff;border-radius:18px;padding:26px 22px;font-size:clamp(17px,2.6vw,21px);font-family:var(--heading-font);min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;}
.timer-ring{font-variant-numeric:tabular-nums;font-weight:800;color:var(--navy);font-size:15px;}
.choice-grid{display:grid;gap:10px;margin-top:14px;}
.choice-grid button{ text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;}
.choice-grid button:hover{border-color:var(--navy-soft);}
.choice-grid button:disabled{opacity:.4;cursor:not-allowed;}
.reveal-note{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;}
.rn-good{background:#F0F3F8;border:1px solid var(--navy);color:var(--navy-ink);}
.rn-bad{background:#C6CDD8;border:1px solid #000;color:#000;}
.rn-info{background:var(--navy-tint);border:1px solid var(--navy-mid);color:var(--navy);}
.mf-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:430px;margin:14px auto;}
.mf-cell{aspect-ratio:1/1;border-radius:9px;background:#E9ECF0;border:1px solid #D1D5DD;display:flex;align-items:center;justify-content:center;font-size:15px;}
.mf-cell.wall{background:#C6CDD8;}
.mf-cell.hide{background:var(--navy-ink);}
.mf-cell.you{background:#fff;border:2px solid var(--navy);color:var(--navy);}
.mf-cell.mine-hit{background:#000;color:#fff;}
.mf-cell.goal{background:var(--navy);color:#fff;}
.mf-dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin-top:10px;}
.mf-dpad button{border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;font-weight:700;color:var(--navy);}
.mf-dpad button:hover{background:var(--navy-tint);}
.xy-pick{display:flex;gap:14px;justify-content:center;margin:16px 0;}
.xy-pick button{width:120px;height:120px;border-radius:22px;font-family:var(--heading-font);font-size:40px;cursor:pointer;border:2px solid transparent;transition:.15s;}
.xy-x{background:var(--navy);color:#fff;}
.xy-y{background:#000;color:#fff;}
.xy-pick button:hover{transform:translateY(-3px);}
.xy-pick button.sel{border-color:var(--navy-ink);}
.payoff-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;}
.payoff-table th,.payoff-table td{border:1px solid var(--line);padding:7px 9px;text-align:center;background:var(--card);}
.payoff-table th{background:var(--navy-tint);color:var(--navy);}
.trust-meter{height:12px;border-radius:99px;background:var(--navy-tint);overflow:hidden;margin-top:6px;}
.trust-meter>div{height:100%;background:linear-gradient(90deg,var(--navy-ink),var(--navy-soft));transition:width .5s;}
.johari-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.johari-quad{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;min-height:150px;}
.johari-quad h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin-bottom:8px;}
.johari-quad .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.johari-quad .chip{background:var(--navy-tint);color:var(--navy);border-radius:99px;font-size:12px;font-weight:600;padding:4px 10px;}
.johari-quad .chip.hot{background:#000;color:#fff;}
.johari-quad .chip.cool{background:var(--navy);color:#fff;}
.johari-quad textarea{width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px;font:inherit;font-size:13px;min-height:44px;resize:vertical;}
.trait-pool{display:flex;flex-wrap:wrap;gap:8px;}
.trait{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;cursor:pointer;transition:.15s;color:var(--navy-ink);}
.trait:hover{border-color:var(--navy-soft);}
.trait.selA{background:var(--navy);color:#fff;border-color:var(--navy);}
.trait.selB{background:#000;color:#fff;border-color:#000;}
.trait.selA.selB{background:linear-gradient(90deg,var(--navy),#000);border-color:var(--navy-ink);}
.drama-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px;}
.drama-card.right{border-left-color:var(--navy);background:#F0F3F8;}
.drama-card.wrong{border-left-color:#000;background:#E9ECF0;}
.plan-weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.plan-week{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;min-height:120px;padding:8px;font-size:12px;}
.plan-week.full{border-style:solid;border-color:var(--navy);}
.plan-week .wk-h{font-weight:800;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.plan-task{border-radius:8px;padding:5px 7px;font-size:11.5px;font-weight:700;margin-bottom:5px;background:var(--navy-tint);color:var(--navy);cursor:grab;border:1px solid transparent;}
.plan-task.err{background:#C6CDD8;color:#000;border-color:#000;}
.plan-bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:40px;}
.orce-line{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;flex-wrap:wrap;}
.orce-line .q{flex:1;min-width:200px;}
.orce-line .bucket{display:flex;gap:5px;}
.orce-line .bucket button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--text-soft);}
.orce-line .bucket button.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
.orce-line .bucket button.ok{background:var(--navy-ink);color:#fff;border-color:var(--navy-ink);}
.orce-line .bucket button.no{background:#000;color:#C6CDD8;border-color:#000;text-decoration:line-through;}
.card-trade{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:720px){.card-trade{grid-template-columns:1fr;}}
.big-offer{background:#000;color:#fff;border-radius:16px;padding:18px;text-align:center;}
.big-offer .amt{font-family:var(--heading-font);font-size:34px;color:#fff;border-bottom:2px solid var(--navy);display:inline-block;padding:0 12px 2px;}
.pitch-slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;}
.pitch-slot h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin:0 0 8px;}
.pitch-slot button{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer;margin-bottom:7px;}
.pitch-slot button.sel{border-color:var(--navy);background:var(--navy-tint);}
.kirk-match{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kirk-metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer;}
.kirk-metric.sel{outline:2px solid var(--navy);}
.kirk-metric.placed{opacity:.45;cursor:default;text-decoration:line-through;}
.kirk-bins{display:grid;gap:8px;}
.kirk-bin{border:1.5px dashed var(--line);border-radius:12px;padding:10px;min-height:54px;font-size:13px;}
.kirk-bin h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--navy);letter-spacing:.05em;}
.studio-case{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);margin-bottom:12px;cursor:pointer;transition:.15s;}
.studio-case:hover{border-color:var(--navy-soft);transform:translateY(-2px);}
.studio-case .cid{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;}
.studio-case.done-card{outline:2px solid rgba(23,46,85,.4);}
.textarea,textarea.ta{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;min-height:78px;resize:vertical;background:var(--paper);}
.textarea:focus,textarea.ta:focus{outline:none;border-color:var(--navy);}
.check-row{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0;}
.check-row input{margin-top:3px;accent-color:var(--navy);}
.ladder-level{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:var(--card);}
.ladder-level .ll-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--heading-font);color:var(--navy);}
.lvl-pips{display:flex;gap:4px;}
.lvl-pips span{width:10px;height:10px;border-radius:50%;background:var(--line);}
.lvl-pips span.on{background:var(--navy);}
.emotion-scenario{background:var(--navy-tint);border-left:5px solid var(--navy);border-radius:0 12px 12px 0;padding:13px 15px;font-size:15px;margin:10px 0;}
.codex-model{border:1px solid var(--line);border-radius:16px;margin-bottom:14px;background:var(--card);overflow:hidden;}
.codex-model .cm-h{background:var(--navy-tint);padding:13px 18px;font-family:var(--heading-font);color:var(--navy);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.codex-model .cm-b{padding:16px 18px;display:none;}
.codex-model.open .cm-b{display:block;}
.codex-phase{border-left:3px solid var(--navy);padding:8px 14px;margin:12px 0;}
.codex-phase h4{margin:0 0 4px;font-size:14px;}
.codex-phase p{font-size:13.5px;color:var(--text-soft);margin:0;}
.playbook-domain h3{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
.playbook-domain .dm{width:12px;height:12px;border-radius:4px;}
.pb-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
.pb-card h4{margin:0 0 2px;font-size:16px;}
.pb-topic{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--navy-soft);}
.pb-toggle{border:0;background:var(--navy-tint);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;margin-top:8px;}
.pb-body{display:none;margin-top:12px;}
.pb-card.open .pb-body{display:block;}
.pb-steps{margin:8px 0 10px;padding-left:18px;font-size:13.5px;color:var(--text-soft);}
.pb-steps li{margin-bottom:5px;}
.pb-tag{display:inline-block;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 9px;margin:3px 4px 0 0;color:var(--text-soft);}
.dossier{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px);}
.cert{border:2px solid var(--navy);border-radius:18px;padding:26px;text-align:center;background:#fff;position:relative;margin-top:20px;}
.cert .cert-logo{height:64px;width:auto;display:block;margin:0 auto 12px;}
.cert .seal-big{width:74px;height:74px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 10px;border:3px solid var(--navy);}
.cert h2{color:var(--navy);letter-spacing:.06em;}
.cert .cert-name{font-family:var(--heading-font);font-size:clamp(24px,4vw,34px);color:var(--navy);margin:6px 0;}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:14px;margin:10px 0;}
.kv dt{color:var(--text-soft);font-weight:600;}
.kv dd{margin:0;font-weight:600;color:var(--navy-ink);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:760px){.grid2{grid-template-columns:1fr;} .plan-weeks{grid-template-columns:repeat(4,1fr);}}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 40px;color:var(--text-soft);font-size:13px;text-align:center;}
.disclaimer{font-size:12px;color:var(--text-soft);background:var(--navy-tint);border-radius:12px;padding:10px 14px;margin-top:16px;}

@media print{
  body{background:#fff;}
  header.topbar,#toastZone,.no-print,.rail-wrap{display:none !important;}
  .card,.dossier{box-shadow:none;break-inside:avoid;}
  .wrap{max-width:100%;padding:0;}
}


/* ============ NOK v4 · new parts, dashboard, certificate ============ */
.topbar{position:sticky;top:0;z-index:80;}

/* micro-engines */
.likert5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0;}
.lk5-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:var(--navy-ink);}
.lk5-b b{font-size:16px;}
.lk5-b span{font-size:11px;line-height:1.2;}
.lk5-b:hover{border-color:#172E55;}
.lk5-b.on{background:#172E55;border-color:#172E55;color:#fff;}
.force4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.force-b{text-align:left;white-space:normal;}
.force-b.on{background:#172E55;border-color:#172E55;color:#fff;}
.bars{display:flex;flex-direction:column;gap:8px;margin:12px 0;}

/* forms */
.lab-l{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin:12px 0 4px;}
.lab-in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:#172E55;}
.lab-in:focus{outline:2px solid #172E55;outline-offset:1px;}
.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;}
.chk{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-right:6px;}
.chk.ok{background:#172E55;}
.chk.no{background:#000;}
.cvprev{border:1px solid var(--line);border-radius:12px;padding:18px 22px;background:#F4F5F7;margin-top:14px;font-size:13px;line-height:1.5;color:#0B1526;text-align:left;}
.cvp-name{font-size:20px;font-weight:800;color:#172E55;letter-spacing:.01em;}
.cvp-head{font-weight:700;margin-top:2px;}
.cvp-contact{font-size:12px;color:#5C6C88;}
.cvprev h4{margin:12px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#172E55;}
.cvprev ul{margin:2px 0 4px 18px;padding:0;}

/* employability radar */
.emp-grid{margin-top:8px;}
.emp-row{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;}
.emp-name{display:flex;flex-direction:column;gap:1px;}
.emp-picks{display:flex;align-items:center;gap:8px;}
.emp-cap{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);min-width:56px;}
.pick4{display:flex;gap:4px;flex:1;}
.pick-b{flex:1;font-size:11px;padding:5px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:#172E55;}
.pick-b.on{background:#172E55;border-color:#172E55;color:#fff;}

/* coach rank */
.rankbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px;}
.rank-step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--text-soft);background:#fff;}
.rank-step b{display:inline-flex;width:19px;height:19px;border-radius:50%;background:#E9ECF0;color:#172E55;align-items:center;justify-content:center;font-size:11px;}
.rank-step.done{border-color:#172E55;color:#172E55;}
.rank-step.done b{background:#172E55;color:#fff;}
.rank-step.on{background:#0B1526;color:#fff;border-color:#0B1526;}
.rank-step.on b{background:#fff;color:#0B1526;}
.rank-tag{margin-left:auto;font-size:12px;color:var(--text-soft);}

/* trainer dashboard */
.roster-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.roster-filters .lab-in{width:auto;flex:0 1 220px;}
.roster-filters input[type="number"]{flex:0 0 100px;}
.rf-actions{display:flex;gap:8px;align-items:center;margin-left:auto;}
.roster-wrap{overflow-x:auto;}
table.roster{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
.roster th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);padding:6px 8px;border-bottom:2px solid #172E55;white-space:nowrap;}
.roster td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;}
.rs-name{font-weight:700;color:#172E55;white-space:nowrap;}
.roster-x{border:0;background:none;cursor:pointer;color:#A2ADBE;font-size:14px;}
.roster-x:hover{color:#000;}
.tkchip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--text-soft);margin-right:4px;margin-bottom:2px;white-space:nowrap;}
.tkchip.on{background:#172E55;border-color:#172E55;color:#fff;}

/* certificate — NOK house style (in-flow, no overlays) */
.cert-wrap{margin-top:22px;}
.cert-set{border:1px dashed var(--line);border-radius:12px;padding:12px 14px 4px;margin-bottom:16px;text-align:left;}
.ds-logo{height:44px;width:auto;display:block;margin-bottom:8px;}
.cert3{background:#fff;border:1px solid #172E55;max-width:880px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.c3-in{border:1px solid #172E55;margin:7px;text-align:center;padding:34px 30px 0;}
.c3-logo{height:62px;width:auto;display:block;margin:0 auto;}
.c3-kicker{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#5C6C88;margin:16px 0 2px;font-weight:700;}
.c3-title{font-family:var(--heading-font);color:#172E55;font-size:clamp(20px,3.2vw,29px);letter-spacing:.13em;font-weight:800;margin:6px 0 16px;line-height:1.25;text-transform:uppercase;}
.c3-rule{display:flex;align-items:center;gap:12px;max-width:420px;margin:0 auto;}
.c3-rule i{width:7px;height:7px;background:#172E55;transform:rotate(45deg);flex:0 0 auto;}
.c3-rule span{flex:1;height:1px;background:#172E55;}
.c3-eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#5C6C88;margin:24px 0 8px;font-weight:600;}
.c3-name{font-family:var(--heading-font);font-weight:800;font-size:clamp(26px,4.6vw,40px);color:#0B1526;letter-spacing:.03em;margin:0 0 6px;line-height:1.2;}
.c3-nrule{width:min(280px,60%);height:2px;background:#172E55;margin:0 auto 18px;opacity:.85;}
.c3-body{max-width:600px;margin:0 auto;font-size:14px;line-height:1.85;color:#415474;}
.c3-body b{color:#172E55;border-bottom:1.5px solid rgba(23,46,85,.35);font-weight:700;}
.c3-stats{display:flex;justify-content:center;gap:12px;margin:22px auto 2px;flex-wrap:wrap;}
.c3-stat{min-width:122px;border:1px solid #D1D5DD;border-radius:12px;padding:9px 16px 10px;text-align:center;background:#fff;}
.c3-stat b{display:block;font-size:16px;color:#172E55;line-height:1.3;}
.c3-stat span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#A2ADBE;font-weight:700;}
.c3-mid{display:flex;align-items:center;justify-content:center;gap:28px;margin:22px auto 8px;flex-wrap:wrap;text-align:left;padding:0 12px;}
.c3-seal{width:118px;height:118px;flex:0 0 auto;}
.c3-issue{max-width:340px;}
.c3-issue p{margin:0 0 7px;font-size:11.5px;line-height:1.65;color:#5C6C88;}
.c3-issue .id{font-weight:800;color:#172E55;letter-spacing:.1em;font-size:12.5px;}
.c3-signs{display:flex;justify-content:center;gap:clamp(30px,10vw,110px);margin:26px auto 22px;flex-wrap:wrap;padding:0 22px;}
.c3-sign{min-width:180px;text-align:center;flex:0 1 auto;}
.c3-sign .line{display:block;border-top:1.5px solid #172E55;margin-bottom:8px;}
.c3-sign b{display:block;color:#0B1526;font-size:13.5px;line-height:1.4;}
.c3-sign span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5C6C88;font-weight:600;}
.c3-foot{font-size:10px;color:#A2ADBE;letter-spacing:.05em;margin:0 auto;padding:0 30px 14px;max-width:660px;line-height:1.7;}
.c3-band{height:8px;background:repeating-linear-gradient(90deg,#172E55 0 18px,#000000 18px 36px,#5C6C88 36px 52px,#A2ADBE 52px 56px,#172E55 56px 74px,#C6CDD8 74px 78px);}
@media (max-width:640px){
  .c3-in{padding:26px 16px 0;}
  .c3-mid{gap:14px;}
  .c3-signs{gap:22px;}
}
@media print{
  .only-cert .summary-section, .only-cert .disclaimer, .only-cert .reveal-note, .cert-set, .only-cert .dossier>hr, .only-cert .no-print{display:none !important;}
  .only-cert .dossier{box-shadow:none;padding:0;}
  .cert3{border-width:1px;}
  body{background:#fff;}
}

/* type alignment & wrap fixes (top bar crowding, glyph overflow, long labels) */
h1,h2,h3{line-height:1.22;}
.topbar-in{row-gap:8px;}
.top-nav button{padding:7px 10px;font-size:12.5px;white-space:nowrap;}
.xp-box{padding:5px 10px;gap:8px;font-size:12px;}
.glyph,.station .glyph{font-size:16px;letter-spacing:0;}
.st-meta{flex-wrap:wrap;gap:3px 12px;}
.hero h1{line-height:1.18;}
.hero{overflow:hidden;}
.brand-text{min-width:0;}
.lk5-b span{line-height:1.25;}
.lk5-b{padding:9px 5px;}
.force-b{line-height:1.4;font-size:14px;padding:12px 14px;text-align:left;}
.pill{line-height:1.4;}
.lede{line-height:1.6;}
.small{line-height:1.55;}
.rank-step{white-space:nowrap;}
.rankbar{row-gap:6px;}
.cvp-head,.cvp-contact,.small2{line-height:1.5;}
@media (max-width:760px){
  .top-nav{margin-left:0;}
  .xp-box{width:100%;justify-content:space-between;}
}

@media (max-width:720px){
  .emp-row{grid-template-columns:1fr;}
  .lab-grid{grid-template-columns:1fr;}
  .force4{grid-template-columns:1fr;}
  .likert5{grid-template-columns:repeat(2,1fr);}
  .sig2{gap:6vw;}
}

  .only-cert .dossier{box-shadow:none;padding:0;}
  
  body{background:#fff;}
}

  if(avg>=4.2) return {label:"Flourishing", desc:"Your self-reported emotional intelligence is strong across the board. The work now is modelling it for others — your calm and your candour teach better than any slide."};

/* --------------------------- gamification ------------------------------ */
function levelOf(xp){
  let i=0; LEVELS.forEach((L,k)=>{ if(xp>=L.xp) i=k; });
  const cur = LEVELS[i], next = LEVELS[i+1];
  const pct = next ? Math.min(100, Math.round(((xp-cur.xp)/(next.xp-cur.xp))*100)) : 100;
  return {idx:i+1, title:cur.t, next:next?next.t:null, nextXp:next?next.xp:null, pct};
}
function updateHud(){
  const L = levelOf(App.xp);
  const xpFill = document.getElementById("xpFill"), xpLvl = document.getElementById("xpLvl"),
        xpNum = document.getElementById("xpNum");
  if(xpFill) xpFill.style.width = L.pct+"%";
  if(xpLvl) xpLvl.textContent = "Lv "+L.idx+" · "+L.title;
  if(xpNum) xpNum.textContent = App.xp+" XP"+(L.next? " · "+(L.nextXp-App.xp)+" to "+L.next:" · max");
  const bc = document.getElementById("badgeCount");
  if(bc) bc.textContent = "🏅 "+Object.keys(App.badges).length+"/"+(Object.keys(BADGES).length+Object.keys(GAME_BADGES).length);
}
function toast(msg, xp){
  const z = document.getElementById("toastZone");
  const t = document.createElement("div"); t.className="toast";
  t.innerHTML = "<span>"+msg+"</span>"+(xp?'<span class="t-xp">+'+xp+" XP</span>":"");
  z.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .5s"; t.style.opacity="0"; setTimeout(()=>t.remove(),500); }, 3800);
}
function confetti(n){
  const colors=["#172E55","#000000","#5C6C88","#A2ADBE","#0B1526","#415474","#E9ECF0"];
  for(let i=0;i<(n||60);i++){
    const p=document.createElement("div"); p.className="confetti-piece";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.4+Math.random()*1.6)+"s";
    p.style.transform="rotate("+Math.random()*360+"deg)";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3200);
  }
}
function flash(){ const f=document.createElement("div"); f.className="flash-award"; document.body.appendChild(f); setTimeout(()=>f.remove(),1000); }
function award(key, xp, badgeKey, note){
  const first = !App.done[key];
  if(first){ App.done[key]=true; App.xp+=xp; }
  if(badgeKey && !App.badges[badgeKey]){
    App.badges[badgeKey]=Date.now();
    const b = BADGES[badgeKey]?BADGES[badgeKey].t:(GAME_BADGES[badgeKey]||"Badge");
    toast("Badge earned — "+b, 0);
  }
  if(first){
    toast((note?note+" — ":"")+"milestone reached", xp);
    confetti();
  }
  updateHud(); save(); renderRail();
  return first;
}
function badge(bk, title){ if(!App.badges[bk]){ App.badges[bk]=Date.now(); toast("Badge earned — "+(title||GAME_BADGES[bk]||bk),0); flash(); save(); } }

function renderRail(){
  const rail = document.getElementById("journeyRail");
  if(!rail) return;
  rail.innerHTML = "";
  const track = document.createElement("div"); track.className="journey-track";
  RAIL.forEach(step=>{
    const d = document.createElement("div");
    const doneStep = stationDone(step.id);
    d.className = "journey-step"+(App.screen===step.id?" active":"")+(doneStep&&App.screen!==step.id?" done":"");
    d.innerHTML = '<span class="dot"></span><span>'+step.l+"</span>";
    d.onclick = ()=>go(step.id);
    track.appendChild(d);
  });
  rail.appendChild(track);
}
function stationDone(id){
  const d=App.done;
  if(id==="disc") return !!d.disc;
  if(id==="eq") return !!d.eq && !!d.emotions;
  if(id==="field") return !!d.team && !!d.conflict;
  if(id==="leadership") return !!d.leadership;
  if(id==="career") return !!d.career;
  if(id==="coach") return !!d.coach_post;
  if(id==="arcade") return Object.keys(App.games).filter(g=>App.games[g]&&App.games[g].done).length>=4;
  if(id==="playbook") return !!d.playbook;
  if(id==="codex") return !!d.codex;
  if(id==="dossier") return !!d.dossier;
  return false;
}

/* Generic single-select MCQ. answersArr persists choices for review. */
function runMCQ(opts){
  const el0 = document.getElementById("app");
  let idx = opts.startAt||0;
  const total = opts.questions.length;
  function renderQ(){
    const q = opts.questions[idx];
    const pct = Math.round((idx/total)*100);
    let selected = opts.answersArr[idx]||null;
    el0.innerHTML =
      '<div class="card">'+
      '<div class="eyebrow-row"><span>'+opts.moduleLabel+"</span><span>Question "+(idx+1)+" of "+total+"</span></div>"+
      '<div class="q-progress-bar"><div class="q-progress-fill" style="width:'+pct+'%"></div></div>'+
      '<h2 class="question-text">'+q.q+"</h2>"+
      '<div class="options" id="optWrap"></div>'+
      '<div class="nav-row">'+
        (opts.onBack? '<button class="btn btn-ghost" id="backBtn">&larr; Back</button>':'<span></span>')+
        '<button class="btn btn-primary" id="nextBtn" disabled>'+(idx===total-1?(opts.cta||"See my results"):"Next")+"</button>"+
      "</div></div>";
    const wrap = document.getElementById("optWrap");
    q.o.forEach(([key,label])=>{
      const b=document.createElement("button"); b.type="button";
      b.className="option"+(selected===key?" selected":"");
      b.innerHTML='<span class="mark"></span><span>'+label+"</span>";
      b.onclick=()=>{
        opts.answersArr[idx]=key;
        Array.from(wrap.children).forEach(c=>c.classList.remove("selected"));
        b.classList.add("selected");
        document.getElementById("nextBtn").disabled=false;
        if(opts.autoNext && idx<total-1) setTimeout(()=>{ opts.answersArr[idx]=key; idx++; renderQ(); scrollTop(); },160);
      };
      wrap.appendChild(b);
    });
    if(selected) document.getElementById("nextBtn").disabled=false;
    document.getElementById("nextBtn").onclick=()=>{
      if(idx<total-1){ idx++; renderQ(); scrollTop(); }
      else { opts.onDone(); scrollTop(); }
    };
    const bb=document.getElementById("backBtn");
    if(bb) bb.onclick=()=>{ if(idx>0){ idx--; renderQ(); scrollTop(); } else if(opts.onBack){ opts.onBack(); scrollTop(); } };
  }
  renderQ();
}
/* Generic 1–5 Likert runner */
function runLikert(opts){
  const el0=document.getElementById("app");
  let idx=opts.startAt||0;
  const total=opts.questions.length;
  const answers=opts.answersArr;
  const labels=opts.scaleLabels||["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
  function renderQ(){
    const item=opts.questions[idx];
    const pct=Math.round((idx/total)*100);
    el0.innerHTML=
      '<div class="card">'+
      '<div class="eyebrow-row"><span>'+opts.moduleLabel+"</span><span>Statement "+(idx+1)+" of "+total+"</span></div>"+
      '<div class="q-progress-bar"><div class="q-progress-fill" style="width:'+pct+'%"></div></div>'+
      '<h2 class="question-text">'+item.text+"</h2>"+
      '<div class="likert-scale" id="likertWrap"></div>'+
      '<div class="nav-row">'+
        (opts.onBack?'<button class="btn btn-ghost" id="backBtn">&larr; Back</button>':'<span></span>')+
        '<button class="btn btn-primary" id="nextBtn" disabled>'+(idx===total-1?(opts.cta||"See my results"):"Next")+"</button>"+
      "</div></div>";
    const wrap=document.getElementById("likertWrap");
    for(let v=1;v<=5;v++){
      const b=document.createElement("button"); b.type="button";
      b.className="likert-opt"+(answers[idx]===v?" selected":"");
      b.innerHTML='<span class="num">'+v+'</span><span class="lbl">'+labels[v-1]+"</span>";
      b.onclick=()=>{
        answers[idx]=v;
        Array.from(wrap.children).forEach(c=>c.classList.remove("selected"));
        b.classList.add("selected");
        document.getElementById("nextBtn").disabled=false;
        if(opts.autoNext && idx<total-1){ setTimeout(()=>{ idx++; renderQ(); scrollTop(); },180); }
      };
      wrap.appendChild(b);
    }
    if(answers[idx]) document.getElementById("nextBtn").disabled=false;
    document.getElementById("nextBtn").onclick=()=>{
      if(idx<total-1){ idx++; renderQ(); scrollTop(); } else { opts.onDone(); scrollTop(); }
    };
    const bb=document.getElementById("backBtn");
    if(bb) bb.onclick=()=>{ if(idx>0){ idx--; renderQ(); scrollTop(); } else if(opts.onBack){ opts.onBack(); scrollTop(); } };
  }
  renderQ();
}
function tallyBy(answers, questions, keyFn){
  const s={};
  answers.forEach((k,i)=>{ if(k!=null){ const g=keyFn(questions[i]); s[g]=(s[g]||0)+1; } });
  return s;
}
function likertSums(answers, questions, keyFn){
  const s={}, c={};
  answers.forEach((v,i)=>{ if(v!=null){ const g=keyFn(questions[i]); s[g]=(s[g]||0)+v; c[g]=(c[g]||0)+1; } });
  const out={}; Object.keys(s).forEach(g=>out[g]=s[g]/c[g]);
  return out;
}

function collinsQuadrant(will,humility){
  const hi=v=>v>=3.5;
  if(hi(will)&&hi(humility)) return {label:"Level 5 indicators present", desc:"You show the paradoxical blend Collins found in the most enduring leaders: fierce resolve about results, paired with genuine humility about your own role in them. Keep protecting both sides — it's rare, and it compounds over time."};
  if(hi(will)) return {label:"Strong will, developing humility", desc:"Your resolve and standards are a real asset. The growth edge is sharing credit outward and looking inward first when things go wrong — the piece that turns an effective leader into an enduring one."};
  if(hi(humility)) return {label:"Strong humility, developing will", desc:"People likely experience you as grounded and generous. The growth edge is building the resolve to hold a hard line and make unpopular calls when the results demand it."};
  return {label:"Both dimensions still developing", desc:"This is a starting point, not a verdict. Pick one dimension — resolve on standards, or humility in how you handle credit and blame — and deliberately practise it for a quarter."};
}

    a.answers.forEach((v,i)=>{ if(v==null) return; const k=RIASEC_QUESTIONS[i].k; sums[k]=(sums[k]||0)+v; cnts[k]=(cnts[k]||0)+1; });
    const avgs={}; ["R","I","A","S","E","C"].forEach(k=>avgs[k]=sums[k]?sums[k]/cnts[k]:0);
    const order=Object.entries(avgs).sort((x,y)=>y[1]-x[1]).map(e=>e[0]);
    a.force=false;
    showValuesSort(avgs, order);
  }
  function showValuesSort(avgs, order){
    const picked = new Set(App.ans.values.picked||[]);
    document.getElementById("app").innerHTML = cardWrap(
      '<p class="pill">The Crossroads · step 2</p><h1>Work-Values Card Sort</h1>'+
      '<p class="lede">Fifteen cards, one rule: <strong>choose exactly five</strong> you would not trade away — the conditions under which you will still want to show up in year three. Click to pick; click again to release.</p>'+
      '<div class="trait-pool" id="vpool" style="gap:9px;">'+
        WORK_VALUES.map((v,i)=>'<button class="trait'+(picked.has(i)?" selA":"")+'" data-vi="'+i+'">'+v.n+"</button>").join("")+
      "</div>"+
      '<div class="score-strip"><span class="score-chip">Selected <b id="vCount">'+picked.size+"</b>/5</span></div>"+
      '<div class="nav-row"><span></span><button class="btn btn-primary" id="vGo"'+(picked.size===5?"":" disabled")+">Lock in my five →</button></div>");
    const pool = document.getElementById("vpool");
    pool.onclick = e=>{
      const b=e.target.closest("[data-vi]"); if(!b) return;
      const i=+b.dataset.vi;
      if(picked.has(i)){ picked.delete(i); b.classList.remove("selA"); }

      document.getElementById("vCount").textContent=picked.size;
      document.getElementById("vGo").disabled = picked.size!==5;
    };
    B("vGo", ()=>{
      App.ans.values.picked=[...picked];
      finishAll(avgs, order);
    });
  }
  function finishAll(avgs, order){
    const code = order.slice(0,3).join("");
    const pickedVals = App.ans.values.picked.map(i=>WORK_VALUES[i]);
    const vg={}; pickedVals.forEach(v=>vg[v.g]=(vg[v.g]||0)+1);
    const lane = scoreLanes({avgs, order}, vg);
    App.results.career = { code, riasec:avgs, riasecOrder:order, values:pickedVals.map(v=>v.n), valueGroups:vg, lane };

}
function scoreLanes(rv, vg){
  const eq=App.results.eq, disc=App.results.disc, lead=App.results.leadership, field=App.results.field;
  const discTop = disc? disc.keys : [];
  const confTop = field? field.conflictOrder.slice(0,2) : [];
  const teamTop = field? Object.entries(field.team).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const lanes = CAREER_LANES.map(L=>{
    let score=8, ev=[];
    (L.fit.riasec||[]).forEach((k,i)=>{
      const val = rv.avgs[k]||0;
      if(val>=3.4){ score += (i===0?30:20); ev.push("RIASEC "+k+" strong ("+val.toFixed(1)+"/5)"); }
      else if(val>=3){ score += (i===0?14:8); }
    });
    (L.fit.eq||[]).forEach(k=>{ if(eq && eq.pillars[k]>=3.6){ score+=18; ev.push("EQ "+EQ_PILLARS[k].name+" high ("+eq.pillars[k].toFixed(1)+")"); } });
    (L.fit.disc||[]).forEach(k=>{ if(discTop.includes(k)){ score+=12; ev.push("DISC "+DISC_TYPES[k].name.split(" (")[0]+" pattern"); } });
    (L.fit.conflict||[]).forEach(k=>{ if(confTop.includes(k)){ score+=8; ev.push("conflict style "+CONFLICT_STYLES[k].name); } });
    (L.fit.team||[]).forEach(k=>{ if(teamTop===k){ score+=8; ev.push("team currently in "+TEAM_STAGES[k].name); } });
    if(L.id==="public" && lead && (lead.maxwellKey==="l4"||lead.maxwellKey==="l5")){ score+=12; ev.push("Maxwell level "+lead.maxwellKey.charAt(1)+" signal"); }
    if(L.id==="data" && lead && lead.will>=3.5){ score+=8; ev.push("high professional will"); }
    if(L.id==="ops" && eq && eq.pillars.regulate>=3.8){ score+=8; ev.push("regulation under heat"); }
    if(L.id==="venture" && eq && eq.pillars.motivate>=3.8){ score+=10; ev.push("self-generated motivation"); }
    if(L.id==="commercial" && vg.reward){ score+=6; }
    if((L.id==="people"||L.id==="talent") && (vg.impact||vg.growth)){ score+=5; }
    if(L.id==="design" && vg.growth){ score+=5; }
    if(L.id==="technical" && vg.safety){ score+=4; }
    if(L.id==="project" && vg.growth){ score+=4; }
    return {L, score:Math.max(16, Math.min(100, Math.round(score*1.35))), ev:ev.slice(0,4)};
  }).sort((a,b)=>b.score-a.score);
  return lanes.slice(0,3).map(x=>({id:x.L.id, name:x.L.name, score:x.score, evidence:x.ev}));
}

function startCoachQuiz(mode){
  const labels = mode==="pre" ? ["Baseline check","Question"] : ["Post-check — the same ten, again","Question"];
  const answers = new Array(QUIZ.length).fill(null);
  let idx=0;
  function renderQ(){
    const q=QUIZ[idx];
    document.getElementById("app").innerHTML = cardWrap(
      '<div class="eyebrow-row"><span>The Coach\'s Path · '+labels[0]+"</span><span>"+labels[1]+" "+(idx+1)+" of "+QUIZ.length+"</span></div>"+
      '<div class="q-progress-bar"><div class="q-progress-fill" style="width:'+Math.round(idx/QUIZ.length*100)+'%"></div></div>'+
      '<h2 class="question-text">'+q.q+"</h2>"+
      '<div class="options" id="qOpts"></div>'+
      '<div class="nav-row"><span></span><button class="btn btn-primary" id="qNext" disabled>'+(idx===QUIZ.length-1?"Finish":"Next")+"</button></div>");
    const wrap=document.getElementById("qOpts");
    q.opts.forEach((o,k)=>{
      const b=document.createElement("button"); b.className="option"; b.type="button";
      b.innerHTML='<span class="mark"></span><span>'+o+"</span>";
      b.onclick=()=>{ answers[idx]=k; Array.from(wrap.children).forEach(c=>c.classList.remove("selected")); b.classList.add("selected"); document.getElementById("qNext").disabled=false; };
      wrap.appendChild(b);
    });
    if(answers[idx]!=null) document.getElementById("qNext").disabled=false;
    B("qNext", ()=>{ if(idx<QUIZ.length-1){ idx++; renderQ(); scrollTop(); } else finishQuiz(); });
  }
  function finishQuiz(){
    let score=0; const review=[];
    QUIZ.forEach((q,i)=>{ const ok = answers[i]===q.correct; if(ok) score++; review.push({q:q.q, chosen:q.opts[answers[i]], correct:q.opts[q.correct], ok}); });
    App.coach[mode]={score, total:QUIZ.length, answers, done:true};
    award("coach_"+mode, 60, mode==="pre"?"coach_pre":"coach_post", mode==="pre"?"Baseline recorded":"Post-check complete");
    document.getElementById("app").innerHTML = cardWrap(
      '<p class="pill">'+(mode==="pre"?"Baseline set":"Post-check done")+" · +60 XP</p><h1>You scored "+score+" / "+QUIZ.length+"</h1>"+

      '<div class="result-block"><h3>Answer review</h3>'+review.map(r=>
        '<div class="drama-card '+(r.ok?"right":"wrong")+'"><strong>'+(r.ok?"✓":"✗")+"</strong> "+r.q+
        (r.ok?"":"<br><span class=\"small muted\">Your pick: "+r.chosen+" — Correct: <strong>"+r.correct+"</strong></span>")+"</div>").join("")+"</div>"+
      '<div class="nav-row"><button class="btn btn-ghost" id="qcBack">Back to the Path</button><button class="btn btn-primary" id="qcGo">'+(mode==="pre"?"Climb the Skills Ladder →":"Open the Dossier →")+"</button></div>");

}

function startLadder(){
  const levels = [1,2,3];
  const names = {1:"Rung 1 · Everyday Moments",2:"Rung 2 · Stakes & Feelings",3:"Rung 3 · Multi-Stakeholder"};
  let li=0, results=[];
  document.getElementById("app").innerHTML = cardWrap(
    '<p class="pill">The Coach\'s Path · Skills Ladder</p><h1>Which response actually keeps the person thinking?</h1>'+
    '<p class="lede">Fifteen everyday moments, one correct coaching move each. Immediate feedback after every choice — that is where the learning happens. You advance rung by rung; your best run is saved.</p>'+
    '<div class="nav-row"><span></span><button class="btn btn-primary" id="ladGo">Start rung 1 →</button></div>');
  B("ladGo", ()=>{ li=0; results=[]; rung(); });
  function rung(){
    const items = ASSESSMENT.filter(x=>x.level===levels[li]);
    let ii=0, score=0;
    document.getElementById("app").innerHTML =
      '<div class="card"><div class="eyebrow-row"><span>'+names[levels[li]]+"</span><span>Run "+(li+1)+" of 3</span></div>"+
      '<div class="q-progress-bar"><div class="q-progress-fill" id="ladBar" style="width:0%"></div></div><div id="ladBody"></div></div>';
    step();
    function step(){
      const item = items[ii];
      document.getElementById("ladBar").style.width = Math.round(ii/items.length*100)+"%";
      const body=document.getElementById("ladBody");
      body.innerHTML='<div class="score-strip"><span class="score-chip">'+esc(item.cat)+" · this rung</span><span class=\"score-chip\">Rung score <b id=\"ladScore\">"+score+"</b></span></div>"+
        '<h2 class="question-text" style="font-size:18px;">'+item.text+'</h2><div class="options" id="ladOpts"></div><div id="ladFb"></div>';
      const wrap=document.getElementById("ladOpts");
      shuffle(item.options.map((o,k)=>[o,k])).forEach(([o,k])=>{
        const b=document.createElement("button"); b.className="option"; b.type="button";
        b.innerHTML='<span class="mark"></span><span>'+o+"</span>";
        b.dataset.k=k;
        b.onclick=()=>{
          if(wrap.dataset.locked) return; wrap.dataset.locked="1";
          const ok = k===item.correctIndex;
          if(ok) score++;
          Array.from(wrap.children).forEach(c=>{ const ck=+c.dataset.k; const cl=(ck===item.correctIndex?"correct":(ck===k?"wrong":"")); if(cl) c.classList.add(cl); });
          document.getElementById("ladScore").textContent=score;
          document.getElementById("ladFb").innerHTML='<div class="reveal-note '+(ok?"rn-good":"rn-info")+'">'+(ok?"Kept them thinking. ":"Here you took the problem (or the rescue) off their plate. ")+"<strong>"+item.explanation+"</strong></div>"+
            '<div class="nav-row"><span></span><button class="btn btn-primary" id="ladNext">'+(ii<items.length-1?"Next moment →":"Finish rung "+(li+1))+"</button></div>";
          B("ladNext", ()=>{ ii++; wrap.dataset.locked=""; if(ii<items.length) step(); else endRung(); });
        };
        wrap.appendChild(b);
      });
    }
    function endRung(){
      results.push({level:levels[li], score, total:items.length});
      li++;
      if(li<3){
        document.getElementById("app").innerHTML = cardWrap(
          '<p class="pill">Rung cleared</p><h2>Rung '+li+" — scored "+results[li-1].score+"/"+results[li-1].total+"</h2>"+
          '<p class="lede">'+(results[li-1].score>=3?"Strong — you're defaulting to coaching questions, not fixing.":"Mixed — the advice reflex still fires under pressure. That's what rung "+(li+1)+" is for.")+"</p>"+
          '<div class="nav-row"><span></span><button class="btn btn-primary" id="ladNext2">Climb to rung '+(li+1)+" →</button></div>");
        B("ladNext2", ()=>rung());
      } else {
        const total=results.reduce((n,r)=>n+r.total,0), got=results.reduce((n,r)=>n+r.score,0);
        App.coach.ladder={results, score:got, total};
        if(!App.done.coach_ladder) award("coach_ladder",120,"coach_ladder","Skills ladder");
        else { save(); }
        document.getElementById("app").innerHTML = cardWrap(
          '<p class="pill">Ladder complete'+(App.done.coach_ladder?" · +120 XP":"")+"</p><h1>"+got+" / "+total+" coaching moves</h1>"+
          '<p class="lede">'+(got>=12?"You consistently leave ownership with the coachee — that is the hard half of coaching.":"You know the shapes; under realistic pressure the fixing reflex still competes. Run two missions, then this ladder again — the middle rung is where habits change.")+"</p>"+
          results.map(r=>'<div class="result-block" style="margin-bottom:10px;"><h3>'+names[r.level]+"</h3><p>"+r.score+"/"+r.total+" — "+(r.score===r.total?"flawless":(r.score>=2?"solid":"shaky"))+"</p></div>").join("")+
          '<div class="nav-row"><button class="btn btn-ghost" id="ladHome">Back to the Path</button><button class="btn btn-primary" id="ladNext3">Open Model Missions →</button></div>');
        B("ladHome", ()=>renderCoach(document.getElementById("app")));
        B("ladNext3", ()=>startMissions());
      }
    }
  }
}

function missionSelect(mkey){
  const M = MISSION_MODELS.find(x=>x.key===mkey);
  const scenarios = eval(M.data);
  const mine = (App.coach.missions&&App.coach.missions[mkey])||scenarios.map(()=>({done:false,score:null}));
  if(!App.coach.missions) App.coach.missions={};
  App.coach.missions[mkey]=mine;
  document.getElementById("app").innerHTML = cardWrap(
    '<p class="pill">Missions · '+M.name+"</p><h1>Pick a coachee</h1>"+
    '<div>'+scenarios.map((s,i)=>
      '<button class="studio-case" data-mi="'+i+'"><span class="cid">'+(mine[i]&&mine[i].done?"✓":i+1)+"</span><strong>"+s.title+"</strong>"+
      '<p class="small muted" style="margin:6px 0 0;">'+s.brief+(mine[i]&&mine[i].done?" · scored "+mine[i].score+"/"+s.mcq.length:"")+"</p></button>").join("")+"</div>"+
    '<div class="nav-row"><button class="btn btn-ghost" id="misBack">← All models</button><span></span></div>');
  B("misBack", ()=>startMissions());
  document.querySelectorAll(".studio-case").forEach(c=>c.onclick=()=>runMission(M, scenarios[+c.dataset.mi], +c.dataset.mi));
}
function runMission(M, S, si){
  const stages = M.stages? eval(M.stages) : MISSION_STAGE_LABELS[M.key].map(l=>({label:l}));
  let idx=0, score=0;
  const style = M.style;
  const totalQ = S.mcq.length;
  document.getElementById("app").innerHTML =
    '<div class="card"><div class="eyebrow-row"><span>'+M.name+" mission · "+S.title+'</span><span>Stage 1 of '+totalQ+'</span></div>'+
    '<div class="q-progress-bar"><div class="q-progress-fill" id="mBar" style="width:0%"></div></div>'+
    '<div id="mBody"></div></div>';
  step();
  function step(){
    document.getElementById("mBar").style.width=Math.round(idx/totalQ*100)+"%";
    const body=document.getElementById("mBody");
    const stageLabel = stages[idx]? stages[idx].label : "Step "+(idx+1);
    const instr = stages[idx]? stages[idx].instruction||stages[idx].label : "";
    let convo = '<div class="drama-card"><strong>'+S.title+"</strong><br>"+S.brief+"</div>";
    if(idx===0) convo += '<div class="emotion-scenario"><strong>Coachee:</strong> “'+S.opening+'”</div>';
    if(style==="replies" && idx>0 && S.replies && S.replies[idx-1]) convo += '<div class="emotion-scenario"><strong>Coachee:</strong> “'+S.replies[idx-1]+'”</div>';
    if(style==="dfm" && idx>0){
      const pre = idx===4? S.discoveryReply : idx===5? S.planReply : null;
      if(pre) convo += '<div class="emotion-scenario"><strong>Coachee:</strong> “'+pre+'”</div>';
    }
    body.innerHTML = convo+
      '<div class="reveal-note rn-info" style="margin:12px 0;"><strong>'+stageLabel+"</strong> — "+instr+"</div>"+
      '<div class="options" id="mOpts"></div><div id="mFb"></div>';
    const wrap=document.getElementById("mOpts");
    const item=S.mcq[idx];
    shuffle(item.options.map((o,k)=>[o,k])).forEach(([o,k])=>{
      const b=document.createElement("button"); b.className="option"; b.type="button";
      b.innerHTML='<span class="mark"></span><span>'+o+"</span>"; b.dataset.k=k;
      b.onclick=()=>{
        if(wrap.dataset.locked) return; wrap.dataset.locked="1";
        const ok=k===item.correctIndex; if(ok) score++;
        Array.from(wrap.children).forEach(c=>{const ck=+c.dataset.k; const cl=(ck===item.correctIndex?"correct":(ck===k?"wrong":"")); if(cl) c.classList.add(cl);});
        document.getElementById("mFb").innerHTML='<div class="reveal-note '+(ok?"rn-good":"rn-bad")+'">'+(ok?"The coachee leans in. ":"The coachee goes quiet. ")+"<strong>"+item.explanation+"</strong></div>"+
          '<div class="nav-row"><span></span><button class="btn btn-primary" id="mNext">'+(idx<totalQ-1?"Continue →":"See mission report")+"</button></div>";
        B("mNext", ()=>{ idx++; wrap.dataset.locked=""; if(idx<totalQ) step(); else finish(); });
      };
      wrap.appendChild(b);
    });
  }
  function finish(){
    const arr = App.coach.missions[M.key];
    const first = !arr[si].done;
    const best = Math.max(arr[si].score||0, score);
    arr[si] = {done:true, score:best, total:totalQ};
    if(first){
      App.xp += 15;
      const totalDone = Object.values(App.coach.missions).reduce((n,a)=>n+a.filter(x=>x.done).length,0);
      if(totalDone>=3) badge("mission");
      toast(M.name+" mission cleared", 15); confetti(24); updateHud();
    }
    save();
    document.getElementById("app").innerHTML = cardWrap(
      '<p class="pill">Mission report · '+M.name+"</p><h1>"+score+" / "+totalQ+" stages run clean</h1>"+
      (style==="sbi"? '<div class="result-block" style="margin-bottom:12px;"><h3>The statement you built</h3><p>'+item_text(S)+'</p></div>':"")+
      (style==="johari" && S.peerReply? '<div class="emotion-scenario" style="border-left-color:var(--blue);"><strong>Peer (responding to your solicitation):</strong> “'+S.peerReply+'”</div>':"")+
      (style==="dfm" && S.timelineReply? '<div class="emotion-scenario" style="border-left-color:var(--plum);"><strong>Coachee commits:</strong> “'+S.timelineReply+'”</div>':"")+
      '<p class="lede">'+(score===totalQ?"Every stage kept ownership with the coachee. That is the whole skill — do it again with someone real this week.":score>=totalQ-1?"One wobble. Find the stage where you nearly took the problem for them; that's where real conversations drift first.":"The advice reflex fired where the model asked for a question. Re-run this one — the coachee's replies tell you what you missed.")+"</p>"+
      '<div class="nav-row"><button class="btn btn-ghost" id="misAgain">Run another scenario</button><button class="btn btn-primary" id="misDone">Back to missions</button></div>');
    B("misAgain", ()=>missionSelect(M.key));
    B("misDone", ()=>startMissions());
  }
  function item_text(S){ return S.mcq.map((m,i)=>'<strong>'+MISSION_STAGE_LABELS.sbi[i]+":</strong> “"+m.options[m.correctIndex]+'”').join("<br>"); }
}

/* --------------------------- PRACTICE STUDIO ----------------------------- */
function startStudio(){
  const st = App.coach.scenarios||{};
  const doneN = Object.values(st).filter(s=>s&&s.done).length;
  const avgScore = (()=>{ const arr=Object.values(st).filter(s=>s&&s.done); return arr.length? Math.round(arr.reduce((n,s)=>n+(s.pct||0),0)/arr.length):null; })();
  document.getElementById("app").innerHTML = cardWrap(
    '<p class="pill">The Coach\'s Path · Practice Studio</p><h1>Ten real cases. Build the conversation before you have it.</h1>'+
    '<p class="lede">Each case file: read the situation and the problem, pick the framework that fits, plan the actual words, then evaluate your plan against the outcome the case needs. No wrong answers — thin answers.</p>'+
    '<div class="score-strip"><span class="score-chip">Cases built <b>'+doneN+"</b>/10</span>"+
    '<span class="score-chip">Avg self-score <b>'+(avgScore!=null?avgScore+"%":"—")+"</b></span></div>"+
    SCENARIOS.map(s=>{
      const mine=st[s.id]||{};
      return '<button class="studio-case'+(mine.done?" done-card":"")+'" data-sid="'+s.id+'">'+
        '<span class="cid">'+(mine.done?"✓":s.id)+"</span><strong>"+s.title+"</strong>"+
        '<span class="small muted"> · '+s.dept+" — "+esc(s.coachee)+"</span>"+
        (mine.done?'<p class="small" style="margin:6px 0 0;">Model: '+(mine.model||"—")+" · outcome checklist "+(mine.pct||0)+"%</p>":"")+
        "</button>";
    }).join("")+
    '<div class="nav-row"><button class="btn btn-ghost" id="stuHome">Back to the Path</button><span></span></div>');
  B("stuHome", ()=>renderCoach(document.getElementById("app")));
  document.querySelectorAll(".studio-case").forEach(c=>c.onclick=()=>caseView(+c.dataset.sid));
}
function caseView(id){
  const S = SCENARIOS.find(x=>x.id===id);
  if(!App.coach.scenarios[id]) App.coach.scenarios[id]={model:null,addons:[],responses:{},checklist:{},done:false,pct:0};
  const mine = App.coach.scenarios[id];
  document.getElementById("app").innerHTML =
    '<div class="card"><div class="eyebrow-row"><span>Case '+S.id+' · '+esc(S.dept)+"</span><span>"+esc(S.coachee)+"</span></div>"+
    "<h1>"+S.title+"</h1>"+
    '<div class="result-block" style="margin-bottom:10px;"><h3>The scenario</h3><p>'+S.scenario+"</p></div>"+
    '<div class="result-block" style="margin-bottom:10px;"><h3>The problem underneath</h3><p>'+S.problem+"</p></div>"+
    '<div class="grid2"><div class="result-block"><h3>Your challenge</h3><ul class="pb-steps">'+S.challenge.map(c=>"<li>"+c+"</li>").join("")+"</ul></div>"+
    '<div class="result-block"><h3>The needed outcome</h3><ul class="pb-steps">'+S.outcome.map(c=>"<li>"+c+"</li>").join("")+"</ul></div></div></div>"+
    cardWrap(
      "<h3>1 · Choose your core model</h3><p class=\"small muted\">Pick the one framework that will structure this conversation. The case hints at a suggestion in brackets — you can disagree.</p>"+
      '<div class="choice-grid" id="modelPick">'+
      Object.entries(MODELS).map(([k,m])=>'<button data-m="'+k+'" class="'+(mine.model===k?"":"")+'" style="'+(mine.model===k?"outline:2px solid var(--navy);":"")+'"><strong>'+m.name+"</strong> — <span class=\"small\">"+m.desc+"</span></button>").join("")+
      "</div>"+
      "<h3 style=\"margin-top:18px;\">2 · Add a sharpening tool (optional)</h3>"+
      '<div class="choice-grid">'+
      Object.entries(ADDONS).map(([k,a])=>'<button data-a="'+k+'" class="'+(mine.addons.includes(k)?"sel-tool":"")+'" style="'+(mine.addons.includes(k)?"outline:2px solid var(--plum);":"")+'"><strong>'+a.name+"</strong> — <span class=\"small\">"+a.desc+"</span></button>").join("")+
      "</div>"+
      (S.primary?'<p class="small muted" style="margin-top:10px;">Case hint — a strong coach in this room would likely reach for: <strong>'+S.primary+"</strong>.</p>":"")+
    "<h3 style=\"margin-top:18px;\">3 · Build the conversation</h3><p class=\"small muted\">Draft the actual words for each stage. Keep them specific to this coachee; generic plans teach you nothing.</p>"+
      '<div id="planFields"></div>'+
      '<div class="nav-row"><button class="btn btn-ghost" id="caseBack">← All cases</button><button class="btn btn-primary" id="caseEval" disabled>Save &amp; evaluate →</button></div>');
  B("caseBack", ()=>startStudio());
  function renderModel(){
    document.querySelectorAll("#modelPick button").forEach(b=>{
      b.style.outline = (b.dataset.m===mine.model?"2px solid var(--navy)":"");
      b.onclick=()=>{ mine.model=b.dataset.m; renderModel(); renderPlan(); };
    });
    document.querySelectorAll("[data-a]").forEach(b=>{
      const on = mine.addons.includes(b.dataset.a);
      b.style.outline = on?"2px solid var(--plum)":"";
      b.style.background = on?"#E9ECF0":"";
      b.onclick=()=>{
        const k=b.dataset.a; const i=mine.addons.indexOf(k);
        if(i>=0) mine.addons.splice(i,1); else mine.addons.push(k);
        renderModel(); renderPlan();
      };
    });
  }
  function renderPlan(){
    const box=document.getElementById("planFields");
    if(!mine.model){ box.innerHTML='<p class="small" style="color:var(--text-soft);">Choose a model above to open its planning fields.</p>'; updateEval(); return; }
    let fields = MODELS[mine.model].fields.slice();
    mine.addons.forEach(a=>{ fields = fields.concat(ADDONS[a].fields.map(f=>Object.assign({},f,{addon:a}))); });
    if(mine.model){ // suggested hint text
      box.innerHTML = fields.map(f=>
        '<p class="small muted" style="margin:10px 0 2px;">'+(f.addon?"[addon] ":"")+f.label.replace(/&amp;/g,"&")+'</p>'+
        '<textarea class="ta" data-fk="'+f.key+'">'+esc(mine.responses[f.key]||"")+"</textarea>").join("")+
        '<div id="hintsBlock" class="result-block" style="margin-top:14px;"><h3>Coach\'s toolkit — hints for this case</h3>'+
        "<ul class=\"pb-steps\">"+S.hints.map(h=>"<li><strong>"+h[0]+":</strong> "+h[1]+"</li>").join("")+"</ul></div>";
      box.querySelectorAll("textarea").forEach(t=>{
        t.oninput=()=>{ mine.responses[t.dataset.fk]=t.value; save(); updateEval(); };
      });
    }
    updateEval();
  }
  function updateEval(){
    const filled = mine.model ? Object.keys(mine.responses).filter(k=>(mine.responses[k]||"").trim().length>10).length : 0;
    const btn=document.getElementById("caseEval");
    if(btn) btn.disabled = !(mine.model && filled>=Math.min(2, (MODELS[mine.model]?MODELS[mine.model].fields.length:4)));
  }
  renderModel(); renderPlan();
  B("caseEval", ()=>evaluateCase(id));
}
function evaluateCase(id){
  const S = SCENARIOS.find(x=>x.id===id);
  const mine = App.coach.scenarios[id];
  document.getElementById("app").innerHTML = cardWrap(
    '<p class="pill">Case '+S.id+' · self-evaluation</p><h1>Does your plan reach the needed outcome?</h1>'+
    '<p class="lede">Be honest — tick only what your written plan genuinely achieves. Then read the sharpening tips from the framework you chose.</p>'+
    "<div>"+S.outcome.map((o,i)=>'<label class="check-row"><input type="checkbox" data-ci="'+i+'" '+((mine.checklist&&mine.checklist[i])?"checked":"")+"><span>"+o+"</span></label>").join("")+"</div>"+
    '<div class="result-block" style="margin-top:14px;"><h3>Framework tips</h3>'+
      "<p class=\"small\"><strong>"+mine.model+":</strong> "+(MODEL_TIPS[mine.model]||"")+"</p>"+
      mine.addons.filter(a=>ADDON_TIPS[a]).map(a=>"<p class=\"small\" style=\"margin-top:6px;\"><strong>"+a+":</strong> "+ADDON_TIPS[a]+"</p>").join("")+
    "</div>"+
    '<div class="nav-row"><span></span><button class="btn btn-gold" id="caseSave">Log my score →</button></div>');
  document.querySelectorAll("[data-ci]").forEach(cb=>{
    cb.onchange=()=>{ mine.checklist=mine.checklist||{}; mine.checklist[cb.dataset.ci]=cb.checked; };
  });
  B("caseSave", ()=>{
    const total=S.outcome.length;
    const got=Object.values(mine.checklist||{}).filter(Boolean).length;
    mine.pct=Math.round(got/total*100); mine.done=true;
    award("coach_scenarios",40,"coach_scenarios","A case built & evaluated");
    if(Object.values(App.coach.scenarios).filter(s=>s&&s.done).length>=10) award("coach_all",100,"coach_all","All ten cases");
    save();
    startStudio();
  });
}

function gameChip(label, val){ return '<span class="score-chip">'+label+" <b>"+val+"</b></span>"; }

    '<p class="pill">The Arcade · play the curriculum</p><h1>Learn by playing, prove it by scoring</h1>'+
